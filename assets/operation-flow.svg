<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title"><title id="title">Conectar, automatizar e decidir</title><rect width="1200" height="190" rx="20" fill="#0d1c2b"/><style>@keyframes travel{to{stroke-dashoffset:-40}}.flow{animation:travel 2s linear infinite}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style><g font-family="DejaVu Sans, Arial, sans-serif"><rect x="28" y="28" width="340" height="134" rx="14" fill="#142d3a" stroke="#345365"/><text x="50" y="64" font-size="14" fill="#5eead4">01</text><text x="50" y="100" font-size="25" font-weight="700" fill="#f1f5f9">CONECTAR</text><text x="50" y="133" font-size="17" fill="#c4d5df">Sistemas, planilhas e APIs</text><rect x="430" y="28" width="340" height="134" rx="14" fill="#142d3a" stroke="#345365"/><text x="452" y="64" font-size="14" fill="#5eead4">02</text><text x="452" y="100" font-size="25" font-weight="700" fill="#f1f5f9">AUTOMATIZAR</text><text x="452" y="133" font-size="17" fill="#c4d5df">Rotinas que tomam tempo</text><rect x="832" y="28" width="340" height="134" rx="14" fill="#142d3a" stroke="#345365"/><text x="854" y="64" font-size="14" fill="#5eead4">03</text><text x="854" y="100" font-size="25" font-weight="700" fill="#f1f5f9">DECIDIR</text><text x="854" y="133" font-size="17" fill="#c4d5df">Informação para agir</text><path d="M368 95h62" stroke="#345365" stroke-width="3"/><path class="flow" d="M368 95h62" stroke="#5eead4" stroke-width="3" stroke-dasharray="10 10"/><path d="M770 95h62" stroke="#345365" stroke-width="3"/><path class="flow" d="M770 95h62" stroke="#5eead4" stroke-width="3" stroke-dasharray="10 10"/></g></svg>