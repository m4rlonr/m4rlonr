<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Marlon Rodrigues</title>
  <desc id="desc">Sua equipe precisa de tempo para fazer o negócio andar. Fontes de dados conectadas a um painel de indicadores.</desc>
  <style>@keyframes dataflow{to{stroke-dashoffset:-32}} .dataflow{stroke-dasharray:8 8;animation:dataflow 2s linear infinite}@media(prefers-reduced-motion:reduce){.dataflow{animation:none}}</style>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0b1423"/>
      <stop offset="1" stop-color="#142d38"/>
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#5eead4"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a5d8e8" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <path d="M56 64H112" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="56" y="104" fill="#91b4c5" font-size="13" letter-spacing="3">SUA OPERAÇÃO PODE FUNCIONAR MELHOR</text>
    <text x="52" y="172" fill="#f1f5f9" font-size="49" font-weight="700" letter-spacing="-2">Marlon Rodrigues</text>
    <text x="56" y="220" fill="#c4d5df" font-size="22">Menos retrabalho. Mais tempo para agir.</text>
    <text x="56" y="295" fill="#5eead4" font-size="14" letter-spacing="1">AGRONEGÓCIO + SOLUÇÕES SOB MEDIDA</text>
  </g>
  <g class="dataflow" fill="none" stroke="#5eead4" stroke-opacity=".5" stroke-width="2">
